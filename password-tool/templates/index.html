<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePass | Password Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header class="hero">
            <h1>Secure<span>Pass</span></h1>
            <p>Generate secure, enterprise-grade passwords instantly.</p>
        </header>

        <main class="card">
            <!-- Output Section -->
            <div class="output-group">
                <input type="text" id="password-output" placeholder="P@$$w0rd..." readonly>
                <button id="copy-btn" title="Copy to clipboard">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                </button>
            </div>

            <!-- Strength Indicator -->
            <div class="strength-group">
                <span class="strength-label">Strength:</span>
                <div class="strength-indicator">
                    <span id="strength-text">-</span>
                    <div class="strength-bars">
                        <div class="bar" id="bar-1"></div>
                        <div class="bar" id="bar-2"></div>
                        <div class="bar" id="bar-3"></div>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Settings Section -->
            <div class="settings">
                <div class="setting-item length-group">
                    <label for="length">Password Length</label>
                    <input type="number" id="length" value="16" min="4" max="64">
                </div>

                <div class="setting-item checkbox-group">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="uppercase" checked>
                        <span class="checkmark"></span>
                        Include Uppercase
                    </label>
                </div>
                
                <div class="setting-item checkbox-group">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="lowercase" checked>
                        <span class="checkmark"></span>
                        Include Lowercase
                    </label>
                </div>

                <div class="setting-item checkbox-group">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="digits" checked>
                        <span class="checkmark"></span>
                        Include Digits
                    </label>
                </div>

                <div class="setting-item checkbox-group">
                    <label class="custom-checkbox">
                        <input type="checkbox" id="symbols" checked>
                        <span class="checkmark"></span>
                        Include Symbols
                    </label>
                </div>
            </div>

            <button id="generate-btn" class="primary-btn">Generate Password</button>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
